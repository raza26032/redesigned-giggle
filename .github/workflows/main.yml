name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Enable & Configure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security

          $upper = [char[]](65..90)
          $lower = [char[]](97..122)
          $num   = [char[]](48..57)
          $spec  = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))

          $password = -join (
            ($upper | Get-Random -Count 4) +
            ($lower | Get-Random -Count 4) +
            ($num   | Get-Random -Count 4) +
            ($spec  | Get-Random -Count 4) |
            Sort-Object {Get-Random}
          )

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          Add-Content $env:GITHUB_ENV "RDP_PASSWORD=$password"

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $path = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $path
          Start-Process msiexec.exe -ArgumentList "/i `"$path`" /quiet /norestart" -Wait
          Remove-Item $path -Force

      - name: Connect Tailscale
        shell: powershell
        run: |
          $auth = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          $host = "gh-runner-" + $env:GITHUB_RUN_ID
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Connect Tailscale
          & $ts up --authkey="$auth" --hostname="$host"

          # Retrieve Tailscale IPv4
          $tsIP = $null
          for ($i=0; $i -lt 10 -and -not $tsIP; $i++) {
            $tsIP = & $ts ip -4
            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            Write-Error "Tailscale did not assign an IP"
            exit 1
          }

          Add-Content $env:GITHUB_ENV "TAILSCALE_IP=$tsIP"

      - name: Verify RDP Port
        shell: powershell
        run: |
          $ip = $env:TAILSCALE_IP
          Write-Host "Checking RDP port on $ip"

          $r = Test-NetConnection -ComputerName $ip -Port 3389
          if (-not $r.TcpTestSucceeded) {
            Write-Error "Port 3389 is NOT reachable"
            exit 1
          }

          Write-Host "RDP Port is OPEN!"

      - name: Keep Alive
        shell: powershell
        run: |
          Write-Host "====================="
          Write-Host " RDP IS READY "
          Write-Host "====================="
          Write-Host "IP Address : $env:TAILSCALE_IP"
          Write-Host "Username   : RDP"
          Write-Host "Password   : $env:RDP_PASSWORD"
          Write-Host "====================="
          while ($true) {
            Start-Sleep -Seconds 300
          }
